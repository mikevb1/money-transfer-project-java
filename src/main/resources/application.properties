# ===============================
# Server Configuration
# ===============================
server.port=8081
server.servlet.context-path=/

# ===============================
# Spring Configuration
# ===============================
spring.application.name=MoneyTransferApp

# ===============================
# Logging Configuration
# ===============================
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.moneytransferapp=DEBUG

# ===============================
# Database Configuration (H2 In-Memory)
# ===============================
spring.datasource.url=jdbc:postgresql://postgres-db-temporal:5432/temporaldatabase
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ===============================
# Temporal Configuration
# ===============================
temporal.service.address=temporal:7233
temporal.namespace=default
temporal.taskQueue=money-transfer-task-queue

# ===============================
# Actuator (Health, Metrics, etc.)
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
